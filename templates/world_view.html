<!DOCTYPE html>
<html>
<head>
    <title>The World View</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink:#1a1a2e; --paper:#fffdf5; --gold:#ffd93d; }
        body { font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif; color:var(--ink);
               text-align:center; padding:20px 15px; margin:0;
               background:linear-gradient(-45deg,#00b09b,#2575fc,#a78bfa);
               background-size:400% 400%; animation:bgshift 16s ease infinite; }
        @keyframes bgshift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .pulse-box { background:var(--paper); border:3px solid var(--ink); padding:26px;
                     border-radius:22px; margin-bottom:22px; box-shadow:6px 6px 0 rgba(26,26,46,.35);
                     display:inline-block; }
        .total-number { font-size:3.2em; font-weight:800; display:block; }
        .chart-card { background:var(--paper); border:3px solid var(--ink); padding:16px;
                      border-radius:20px; margin-top:10px; display:inline-block; }
        .message { font-size:1.05em; line-height:1.5; color:white; margin:20px auto; max-width:420px;
                   text-shadow:0 1px 3px rgba(0,0,0,.25); }
        a.btn { display:inline-block; margin-top:24px; padding:12px 30px; border:3px solid var(--ink);
                border-radius:999px; text-decoration:none; font-weight:800; color:var(--ink);
                background:var(--gold); box-shadow:4px 4px 0 var(--ink); }
    </style>
</head>
<body>
    <div style="font-size:46px">🌍🧠🌍</div>
    <div class="pulse-box">
        <span class="total-number">{{total}}</span>
        <span>Minds Explored So Far</span>
    </div>

    <h1 style="color:white; transform:rotate(-1deg)">You are not alone. 🫂</h1>
    <p class="message">
        Neurodiversity is the standard, not the exception. Below is the
        <strong>Community Signature</strong> — the average of every person who has walked
        this path. Your unique spikes are simply different notes in the same human symphony. 🎼
    </p>

    <div class="chart-card">
        <canvas id="worldChart"></canvas>
    </div>

    <div>
        <a class="btn" href="/">🎪 Back to the circus</a>
    </div>

    <script>
        new Chart(document.getElementById('worldChart'), {
            type: 'radar',
            data: {
                labels: {{ labels|tojson }},
                datasets: [{
                    label: 'The Community Average',
                    data: {{ avg_scores|tojson }},
                    borderColor: '#a78bfa',
                    backgroundColor: 'rgba(167, 139, 250, 0.3)',
                    borderWidth: 4,
                    pointRadius: 0
                }]
            },
            options: {
                scales: { r: { min: 0, max: 8, ticks: { display: false },
                         grid: { color: 'rgba(0,0,0,.06)' },
                         pointLabels: { color: '#1a1a2e', font: { size: 10, weight: 'bold' } } } },
                plugins: { legend: { display: false } }
            }
        });
    </script>
</body>
</html>
