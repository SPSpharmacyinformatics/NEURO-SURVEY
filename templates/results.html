<!DOCTYPE html>
<html>
<head>
    <title>Your Wiggly Result</title>
    <script src="/static/js/chart.umd.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <style>
        :root { --ink:#1a1a2e; --paper:#fffdf5; --gold:#ffd93d; }
        body { font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif; color:var(--ink);
               text-align:center; padding:20px 15px; margin:0;
               background:linear-gradient(-45deg,#2575fc,#6a11cb,#ff5da2);
               background-size:400% 400%; animation:bgshift 16s ease infinite; }
        @keyframes bgshift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .result-card { background:var(--paper); border:3px solid var(--ink); padding:22px;
                       border-radius:20px; margin-bottom:20px; box-shadow:6px 6px 0 rgba(26,26,46,.35); }
        .result-title { font-size:1.5em; font-weight:800; margin-bottom:5px; }
        .result-desc { font-size:.95em; color:#5a6270; line-height:1.45; }
        .chart-box { background:var(--paper); padding:12px; border:3px solid var(--ink);
                     border-radius:20px; margin-top:10px; display:inline-block; }
        .disclaimer { font-size:.72em; color:#f0f4ff; margin-top:16px; font-style:italic; }
        a.btn { display:inline-block; margin:16px 6px 0; padding:12px 26px; border:3px solid var(--ink);
                border-radius:999px; text-decoration:none; font-weight:800; color:var(--ink);
                box-shadow:4px 4px 0 var(--ink); }
        a.gold { background:var(--gold); } a.purple { background:#e0d5ff; }
        .mascot { font-size:44px; }
    </style>
</head>
<body>
    <div class="mascot">🎉🧠🎉</div>
    <p style="color:white; font-weight:700;">Analysis for {{name}} ({{age}})</p>

    <div class="result-card">
        <div class="result-title">{{profile_title}}</div>
        <div class="result-desc">{{profile_desc}}</div>
    </div>

    <div class="chart-box">
        <canvas id="radarChart"></canvas>
    </div>

    <p class="disclaimer">Note: this engine provides a logical classification based on
    self-reported intensities. It is a tool for self-discovery, not a clinical diagnosis. ☝️</p>
    <a class="btn gold" href="/">← New assessment</a>
    <a class="btn purple" href="/world-view">See the World View 🌍</a>

    <script>
        new Chart(document.getElementById('radarChart'), {
            type: 'radar',
            data: {
                labels: {{ labels|tojson }},
                datasets: [{
                    label: 'Your Map',
                    data: {{ scores|tojson }},
                    borderColor: '#ff5da2',
                    backgroundColor: 'rgba(255, 93, 162, 0.35)',
                    borderWidth: 3
                }, {
                    label: 'Baseline',
                    data: Array({{ labels|length }}).fill(2),
                    borderColor: 'rgba(26, 26, 46, 0.45)',
                    borderDash: [5, 5],
                    fill: false,
                    pointRadius: 0
                }]
            },
            options: {
                scales: { r: { min: 0, max: 8, ticks: { display: false },
                         pointLabels: { color: '#1a1a2e', font: { size: 9, weight: 'bold' } } } },
                plugins: { legend: { display: false } }
            }
        });
        (function(){ // confetti
            const bits=["🎉","⭐","🎊","💛","🧠","🌈","✨"];
            for(let i=0;i<70;i++){const s=document.createElement("span");
            s.textContent=bits[Math.floor(Math.random()*bits.length)];
            s.style.cssText="position:fixed;z-index:99;font-size:22px;pointer-events:none;left:"+
            Math.random()*100+"vw;top:-5vh;animation:fall linear forwards;animation-duration:"+
            (2+Math.random()*2.5)+"s;animation-delay:"+Math.random()*0.8+"s";
            document.body.appendChild(s);setTimeout(()=>s.remove(),5500);}
            const st=document.createElement("style");
            st.textContent="@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}";
            document.head.appendChild(st);
        })();
    </script>
</body>
</html>
